# SimHub -- departmental deployment.
#
#   docker compose up -d                             start (pulls the published image)
#   docker compose pull && docker compose up -d      update to the latest image
#   docker compose exec simhub node seed.js          load the example scenario
#   docker compose ps                                check status (look for "healthy")
#
# Compose automatically reads a sibling ".env" file, so copy ".env.example"
# to ".env" and edit it to override any of the settings below.
#
# To build from local source instead of pulling the published image, comment
# out the `image:` line and uncomment the `build: .` line. Building needs the
# full source tree checked out next to this file; pulling does not.

services:
  simhub:
    # Published automatically to GitHub Container Registry on every push to
    # main. GHCR forces the owner/repo to lowercase, hence "authortom".
    image: ghcr.io/authortom/simhub:latest
    # build: .
    container_name: simhub

    # Restart on failure and on daemon/host reboot, but not if an operator
    # deliberately stopped it.
    restart: unless-stopped

    # PID 1 that forwards signals and reaps zombies, so SIGTERM reaches node
    # and the graceful-shutdown handler can flush state on `compose down`.
    init: true

    ports:
      # "host:container" -- change the LEFT number to serve on a different host
      # port. Quoted so YAML never reinterprets it (e.g. 22:22 as base-60).
      - "3000:3000"

    environment:
      # Production defaults. Override in .env if needed.
      NODE_ENV: production
      # TRUST_PROXY: "1"   # set when behind a reverse proxy (see .env.example)

    volumes:
      # All scenarios, programmes, users and sessions live here. A named volume
      # survives image updates and rebuilds; back it up regularly.
      - simhub-data:/app/data

    healthcheck:
      # Alpine/slim runtime images ship no curl or wget, so probe with Node's
      # built-in fetch (Node 18+). Exec (list) form is used deliberately: it
      # avoids a shell AND keeps YAML from misreading the "://" / colon-space
      # in the script as a nested mapping. A bare `test: node -e "a: b"` string
      # containing a colon-space WOULD need quoting; the list form sidesteps it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  simhub-data:
